# main ブランチへの push をトリガーに、ビルドして GitHub Pages へ自動デプロイする
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions タブから手動実行も可能にする
  workflow_dispatch:

# GITHUB_TOKEN に Pages 公開に必要な権限を付与する
permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走るデプロイは 1 つに制限する（進行中のものは中断しない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ビルドジョブ：dist/ を成果物としてアップロードする
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      - name: 本番用ビルド
        run: npm run build

      - name: Pages 用に設定
        uses: actions/configure-pages@v5

      - name: ビルド成果物（dist）をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # デプロイジョブ：アップロードした成果物を Pages へ公開する
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
